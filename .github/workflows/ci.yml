name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 零依赖：无需 npm install
      - name: 语法 / 入口 / 离线引用 / 断言数门禁
        run: node scripts/check.mjs
      - name: 逻辑层自测
        run: node scripts/selftest.mjs
      - name: 渲染基准（缓存帧 / 视口裁剪阈值）
        run: node scripts/bench.mjs
      - name: 单文件发行包校验（无外部引用 + SHA256）
        run: node scripts/build.mjs --check

  vendor-check:
    name: vendor 接线自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: vendor 路径 ↔ ngm.json ↔ ngm.lock
        run: node scripts/check-ngm.mjs

  ngm-preflight:
    name: ngm binary configuration preflight
    runs-on: ubuntu-latest
    steps:
      - name: Explain optional ngm verify
        run: |
          if [ -z "${{ vars.NGM_BIN_URL }}" ] || [ -z "${{ vars.NGM_BIN_SHA256 }}" ]; then
            echo "::notice::ngm verify skipped: set repository variables NGM_BIN_URL and NGM_BIN_SHA256 to a reachable ngm release artifact. The vendor self-check still runs."
          else
            echo "ngm verify configured: ${{ vars.NGM_BIN_URL }}"
          fi

  ngm-verify:
    name: ngm verify --deep (optional binary)
    if: ${{ vars.NGM_BIN_URL != '' && vars.NGM_BIN_SHA256 != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned ngm binary
        env:
          NGM_BIN_URL: ${{ vars.NGM_BIN_URL }}
          NGM_BIN_SHA256: ${{ vars.NGM_BIN_SHA256 }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ngm"
          if ! curl -fsSL --retry 3 --retry-delay 2 "$NGM_BIN_URL" -o "$bin"; then
            echo "::error::failed to download ngm from NGM_BIN_URL; the runner is network-restricted or the URL is stale"
            exit 1
          fi
          echo "$NGM_BIN_SHA256  $bin" | sha256sum -c -
          chmod +x "$bin"
          want="$(tr -d '\r\n' < .ngm-version)"
          got="$("$bin" --version | awk '{print $2}')"
          if [ "$got" != "$want" ]; then
            echo "::error::ngm version mismatch: binary=$got expected=$want"
            exit 1
          fi
      - name: Verify vendor provenance
        run: |
          "$RUNNER_TEMP/ngm" verify --deep

  discipline:
    # 十问看板（方法论 §8）：只回答"这个仓库几档、缺哪一条"，不改任何东西。
    # --strict 在低于 L3 时退 1——防止新仓库悄悄从 L0 起步。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 十问看板
        run: node scripts/check-discipline.mjs --strict
