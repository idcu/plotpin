name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 零依赖：无需 npm install
      - name: 契约判据（版本三处一致 / i18n 键对齐 / 文件头 / 枚举同源）
        run: node scripts/check-contracts.mjs
      - name: 对外 API 面（PlotPin 顶层键 ↔ contracts/plugin-api.json）
        run: node scripts/check-plugin-api.mjs
      - name: Service Worker 缓存版本（预缓存指纹 ↔ scripts/sw-inputs.sha256）
        run: node scripts/check-sw.mjs
      - name: 语法 / 入口 / 离线引用 / 断言数 / 逻辑层自测（--selftest）
        run: node scripts/check.mjs --selftest
      - name: 渲染基准（avg / P95 / 静态重建 / heapUsed 阈值门禁）
        run: node scripts/bench.mjs
      - name: 单文件发行包校验（源重建 ↔ dist-manifest 登记哈希）
        run: node scripts/build.mjs --check
      - name: 门禁牙齿自测（正面基线 + 13 种人为破坏）
        run: node scripts/check-gates.mjs

  e2e:
    # Playwright 需要一个可用的 Chromium 与系统库；本地开发机已装过浏览器，
    # 首次在 GitHub runner 上执行时由本 job 的 install 步骤安装。
    # 注意：本地无法验证 runner 上的真实执行（见 docs/engineering.md §3.5），
    # 该 job 的实际耗时/稳定性以 CI 运行记录为准，不得用本地 e2e 结果代替。
    name: 浏览器 e2e（Chromium）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: 安装开发期依赖（@playwright/test，不进发行包）
        run: npm ci
      - name: 安装 Chromium 与系统依赖
        run: npx playwright install --with-deps chromium
      - name: Playwright 功能 e2e（145 用例，1 条按环境条件跳过）
        run: node scripts/e2e.mjs

  vendor-check:
    name: vendor 接线自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: vendor 路径 ↔ ngm.json ↔ ngm.lock
        run: node scripts/check-ngm.mjs

  ngm-preflight:
    name: ngm binary configuration preflight
    runs-on: ubuntu-latest
    steps:
      - name: Explain optional ngm verify
        run: |
          if [ -z "${{ vars.NGM_BIN_URL }}" ] || [ -z "${{ vars.NGM_BIN_SHA256 }}" ]; then
            echo "::notice::ngm verify skipped: set repository variables NGM_BIN_URL and NGM_BIN_SHA256 to a reachable ngm release artifact. The vendor self-check still runs."
          else
            echo "ngm verify configured: ${{ vars.NGM_BIN_URL }}"
          fi

  ngm-verify:
    name: ngm verify --deep (optional binary)
    if: ${{ vars.NGM_BIN_URL != '' && vars.NGM_BIN_SHA256 != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify pinned ngm binary
        env:
          NGM_BIN_URL: ${{ vars.NGM_BIN_URL }}
          NGM_BIN_SHA256: ${{ vars.NGM_BIN_SHA256 }}
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/ngm"
          if ! curl -fsSL --retry 3 --retry-delay 2 "$NGM_BIN_URL" -o "$bin"; then
            echo "::error::failed to download ngm from NGM_BIN_URL; the runner is network-restricted or the URL is stale"
            exit 1
          fi
          echo "$NGM_BIN_SHA256  $bin" | sha256sum -c -
          chmod +x "$bin"
          want="$(tr -d '\r\n' < .ngm-version)"
          got="$("$bin" --version | awk '{print $2}')"
          if [ "$got" != "$want" ]; then
            echo "::error::ngm version mismatch: binary=$got expected=$want"
            exit 1
          fi
      - name: Verify vendor provenance
        run: |
          "$RUNNER_TEMP/ngm" verify --deep

  discipline:
    # 十问看板（方法论 §8）：只回答"这个仓库几档、缺哪一条"，不改任何东西。
    # --strict 在低于 L3 时退 1——防止新仓库悄悄从 L0 起步。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 十问看板
        run: node scripts/check-discipline.mjs --strict
